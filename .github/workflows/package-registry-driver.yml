name: Package registry driver

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Catalog-safe driver identifier
        required: true
        type: string
      version:
        description: Upstream driver version
        required: true
        type: string
      upstream_archive_url:
        description: HTTPS URL of the public upstream tar or zip archive
        required: true
        type: string
      upstream_sha256:
        description: Expected SHA-256 digest of the downloaded upstream archive
        required: true
        type: string
      library_path:
        description: Optional exact archive-relative .so path; leave empty to require exactly one .so
        required: false
        default: ""
        type: string
      entrypoint:
        description: Exported ADBC driver initialization symbol
        required: true
        type: string
      release_tag:
        description: New immutable GitHub Release tag to create
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package Linux amd64 driver
    runs-on: ubuntu-24.04
    env:
      SLUG: ${{ inputs.slug }}
      VERSION: ${{ inputs.version }}
      UPSTREAM_ARCHIVE_URL: ${{ inputs.upstream_archive_url }}
      UPSTREAM_SHA256: ${{ inputs.upstream_sha256 }}
      LIBRARY_PATH: ${{ inputs.library_path }}
      ENTRYPOINT: ${{ inputs.entrypoint }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Download, verify, package, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077

          case "$SLUG" in (*[!a-z0-9._-]*|""|[.-]*) exit 1;; esac
          case "$VERSION" in (*[!A-Za-z0-9._+-]*|""|????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????????*) exit 1;; esac
          case "$RELEASE_TAG" in (*[!A-Za-z0-9._/-]*|""|/*|*//*) exit 1;; esac
          case "$ENTRYPOINT" in ([A-Za-z_][A-Za-z0-9_]*) ;; (*) exit 1;; esac
          case "$UPSTREAM_SHA256" in (*[!0123456789abcdef]*|????????????????????????????????????????????????????????????????) ;; (*) exit 1;; esac
          case "$UPSTREAM_ARCHIVE_URL" in (https://[A-Za-z0-9.-]*/*) ;; (*) exit 1;; esac
          if [ -n "$LIBRARY_PATH" ] && ! [[ "$LIBRARY_PATH" =~ ^[A-Za-z0-9][A-Za-z0-9._/+@=-]*\.so$ ]]; then
            exit 1
          fi
          if [[ "$LIBRARY_PATH" =~ (^|/)(\.|\.\.)(/|$) ]]; then
            exit 1
          fi

          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          cd "$workdir"

          curl --fail --show-error --location --proto '=https' --tlsv1.2 --max-redirs 5 --max-filesize 1073741824 \
            --retry 3 --retry-all-errors --output upstream.archive "$UPSTREAM_ARCHIVE_URL"
          printf '%s  %s\n' "$UPSTREAM_SHA256" upstream.archive | sha256sum --check --strict

          # Extract only regular files and directories after rejecting unsafe archive paths.
          python3 - upstream.archive upstream <<'PY'
          import pathlib
          import shutil
          import sys
          import tarfile
          import zipfile

          source = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          maximum_files = 10_000
          maximum_size = 1 << 30
          allowed = set("ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789._/+@=-")

          def safe_name(name):
              path = pathlib.PurePosixPath(name)
              if not name or "\\" in name or name.startswith("/") or any(part in ("", ".", "..") for part in path.parts):
                  raise ValueError(f"unsafe archive path: {name!r}")
              if any(character not in allowed for character in name):
                  raise ValueError(f"unsupported archive path characters: {name!r}")
              return path

          members = []
          if tarfile.is_tarfile(source):
              with tarfile.open(source, "r:*") as archive:
                  for member in archive.getmembers():
                      safe_name(member.name.rstrip("/"))
                      if not (member.isdir() or member.isreg()):
                          raise ValueError(f"archive member is not a regular file or directory: {member.name!r}")
                      members.append((member.name.rstrip("/"), member.size if member.isreg() else 0, member, archive))
                  if len(members) > maximum_files or sum(item[1] for item in members) > maximum_size:
                      raise ValueError("archive exceeds extraction limits")
                  if len({item[0] for item in members}) != len(members):
                      raise ValueError("archive contains duplicate paths")
                  for name, _, member, _ in members:
                      target = destination.joinpath(*pathlib.PurePosixPath(name).parts)
                      if member.isdir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with archive.extractfile(member) as input_file, target.open("xb") as output_file:
                              shutil.copyfileobj(input_file, output_file)
                          target.chmod(0o644)
          elif zipfile.is_zipfile(source):
              with zipfile.ZipFile(source) as archive:
                  for member in archive.infolist():
                      name = member.filename.rstrip("/")
                      safe_name(name)
                      mode = member.external_attr >> 16
                      is_directory = member.is_dir()
                      if member.flag_bits & 1 or (mode and not is_directory and (mode & 0o170000) not in (0, 0o100000)):
                          raise ValueError(f"encrypted or non-regular zip member: {member.filename!r}")
                      members.append((name, 0 if is_directory else member.file_size, member, archive))
                  if len(members) > maximum_files or sum(item[1] for item in members) > maximum_size:
                      raise ValueError("archive exceeds extraction limits")
                  if len({item[0] for item in members}) != len(members):
                      raise ValueError("archive contains duplicate paths")
                  for name, _, member, _ in members:
                      target = destination.joinpath(*pathlib.PurePosixPath(name).parts)
                      if member.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with archive.open(member) as input_file, target.open("xb") as output_file:
                              shutil.copyfileobj(input_file, output_file)
                          target.chmod(0o644)
          else:
              raise ValueError("unsupported upstream archive format; expected tar or zip")
          PY

          if [ -n "$LIBRARY_PATH" ]; then
            library="upstream/$LIBRARY_PATH"
            test -f "$library"
            test "$(find upstream -type f -name '*.so' -print | wc -l)" -eq 1
          else
            mapfile -d '' libraries < <(find upstream -type f -name '*.so' -print0)
            test "${#libraries[@]}" -eq 1
            library="${libraries[0]}"
          fi
          library_name=$(basename "$library")
          readelf --file-header "$library" | grep --fixed-strings 'Class:                             ELF64'
          readelf --file-header "$library" | grep --fixed-strings 'Machine:                           Advanced Micro Devices X86-64'
          readelf --file-header "$library" | grep --fixed-strings 'Type:                              DYN (Shared object file)'
          nm --dynamic --defined-only "$library" | awk '{print $3}' | grep --fixed-strings --line-regexp "$ENTRYPOINT"

          mkdir -p package/lib
          install --mode=0644 "$library" "package/lib/$library_name"
          library_sha256=$(sha256sum "package/lib/$library_name" | cut --delimiter=' ' --fields=1)
          archive="$SLUG-$VERSION-linux-amd64.tar.gz"
          jq --null-input --compact-output \
            --arg name "$SLUG" --arg version "$VERSION" --arg library "lib/$library_name" \
            --arg entrypoint "$ENTRYPOINT" --arg library_sha256 "$library_sha256" \
            '{name: $name, version: $version, os: "linux", arch: "amd64", library: $library, entrypoint: $entrypoint, library_sha256: $library_sha256, archive_sha256: ("0" * 64)}' \
            > package/manifest.json
          tar --create --format=ustar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            --directory package --file - manifest.json lib | gzip --no-name > "$archive"
          sha256sum "$archive" > "$archive.sha256"

          test "$(tar --list --file "$archive" --gzip)" = "$(printf 'manifest.json\nlib/\nlib/%s' "$library_name")"
          mkdir verified
          tar --extract --file "$archive" --gzip --directory verified
          jq --exit-status \
            --arg name "$SLUG" --arg version "$VERSION" --arg library "lib/$library_name" --arg entrypoint "$ENTRYPOINT" \
            'type == "object" and (keys | sort) == ["arch", "archive_sha256", "entrypoint", "library", "library_sha256", "name", "os", "version"] and .name == $name and .version == $version and .os == "linux" and .arch == "amd64" and .library == $library and .entrypoint == $entrypoint and (.library_sha256 | test("^[0-9a-f]{64}$")) and .archive_sha256 == ("0" * 64)' \
            verified/manifest.json
          test "$(sha256sum "verified/lib/$library_name" | cut --delimiter=' ' --fields=1)" = "$library_sha256"
          readelf --file-header "verified/lib/$library_name" | grep --fixed-strings 'Machine:                           Advanced Micro Devices X86-64'
          nm --dynamic --defined-only "verified/lib/$library_name" | awk '{print $3}' | grep --fixed-strings --line-regexp "$ENTRYPOINT"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf '%s\n' "release tag already exists; refusing to alter an immutable release" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$archive" "$archive.sha256" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$SLUG $VERSION" \
            --notes "Curated $SLUG ADBC driver $VERSION for Linux amd64."
