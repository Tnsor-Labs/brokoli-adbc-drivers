name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate index shape
        run: |
          jq -e '
            .version == 1 and
            (.drivers | type == "array") and
            all(.drivers[]; (
              (.name | test("^[a-z0-9][a-z0-9._-]{0,127}$")) and
              (.display_name | type == "string" and length > 0) and
              (.description | type == "string" and length > 0) and
              (.icon | type == "string" and test("^[a-z0-9_-]+$")) and
              (.icon_url == null or (.icon_url | type == "string" and test("^https://"))) and
              (.license | type == "string" and length > 0) and
              (.homepage | test("^https://")) and
              (.version | type == "string" and length > 0) and
              (.os | type == "string" and length > 0) and
              (.arch | type == "string" and length > 0) and
              (.archive_url | test("^https://github.com/Tnsor-Labs/brokoli-adbc-drivers/releases/download/")) and
              (.sha256 | test("^[0-9a-fA-F]{64}$"))
            ))
          ' index.json

  # The shape check above accepts an entry whose archive does not install
  # or whose driver does not load. This job installs every Linux entry with
  # Brokoli's own installer (digests, manifest-matches-entry, version rules)
  # and loads it through the ADBC driver manager, in an environment shaped
  # like Brokoli's native worker image, and requires each driver to depend
  # only on the base C/C++ runtime. It would have refused the PostgreSQL
  # build that needed the system's libpq, and the SQLite build that needed
  # its libsqlite3.
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the load check
        run: docker build -t catalog-loadcheck tools/loadcheck
      - name: Install and load every driver
        run: docker run --rm -v "$PWD/index.json:/catalog/index.json:ro" catalog-loadcheck
